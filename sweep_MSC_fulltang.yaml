program: sweep_MSC_everysweep.py  # 1단계에서 작성한 스크립트
entity: hails # 본인 wandb 계정명으로 변경
project: TagNet MSC sweep everything schedule 16
method: random      # 탐색 방법: bayes
objectives:
  - goal: maximize
    name: Test/Best Avg Accuracy # 목표 1: 검증 정확도 (최대화)
  - goal: minimize
    name: TestLoss/Diversity Loss 
  - goal: minimize
    name: TestLoss/Specialization Loss

parameters:
  reg_alpha:
    # 0.0001 ~ 0.1 사이의 로그 스케일에서 무작위 값 선택
    distribution: log_uniform_values 
    min: 0.0001
    max: 0.1

  reg_beta:
    # 0.0001 ~ 0.1 사이의 로그 스케일에서 무작위 값 선택
    distribution: log_uniform_values 
    min: 0.0001
    max: 0.1

  disc_lr:
    # 3, 4, 5, 6, 7 중 정수 값 무작위 선택
    distribution: log_uniform_values 
    min: 0.01
    max: 1

  switcher_lr:
    # 3, 4, 5, 6, 7 중 정수 값 무작위 선택
    distribution: log_uniform_values 
    min: 0.01
    max: 1

  lambda_p:
    # 0.001 ~ 1 사이의 로그 스케일에서 무작위 값 선택
    distribution: log_uniform_values 
    min: 0.001
    max: 2

  lr_domain:
    # 0.001 ~ 1 사이의 로그 스케일에서 무작위 값 선택
    distribution: log_uniform_values 
    min: 0.000001
    max: 0.01

  lr_domain_min:
    # 0.001 ~ 1 사이의 로그 스케일에서 무작위 값 선택
    distribution: log_uniform_values 
    min: 0.00000001
    max: 0.01


  lr_domain_prop:
    distribution: uniform
    min: 0
    max: 1
