program: sweep_MSC_eachtaskbydomain_fixedlambdap_probalways_entropy.py  # 1단계에서 작성한 스크립트
entity: hails # 본인 wandb 계정명으로 변경
project: TagNet MSC sweep 16
method: bayes      # 탐색 방법: bayes
metric:
  name: Test/Best Avg Accuracy
  goal: maximize

parameters:
  reg_alpha:
    # 0.0001 ~ 0.1 사이의 로그 스케일에서 무작위 값 선택
    distribution: log_uniform_values 
    min: 0.0001
    max: 0.1

  reg_beta:
    # 0.0001 ~ 0.1 사이의 로그 스케일에서 무작위 값 선택
    distribution: log_uniform_values 
    min: 0.0001
    max: 0.1

  disc_lr:
    # 3, 4, 5, 6, 7 중 정수 값 무작위 선택
    distribution: log_uniform_values 
    min: 0.01
    max: 1

  switcher_lr:
    # 3, 4, 5, 6, 7 중 정수 값 무작위 선택
    distribution: log_uniform_values 
    min: 0.01
    max: 1